<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>虎キング v3.9.6 by Popolo App.com</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #000; overflow: hidden; }
        #header { background: #1a1a1a; color: #ff9900; padding: 6px 90px 6px 10px; text-align: center; font-weight: bold; position: fixed; top: 0; left: 0; width: 100%; min-height: 55px; z-index: 3000; border-bottom: 2px solid #ff9900; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }
        #map { height: 100vh; width: 100vw; z-index: 1; background: #222; }
        #setup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4000; display: flex; align-items: center; justify-content: center; }
        .setup-box { background: rgba(34, 34, 34, 0.9); padding: 20px; border-radius: 15px; border: 2px solid #ff9900; text-align: center; width: 85%; max-width: 340px; }
        .style-btn { flex: 1; padding: 16px 8px; font-size: 14px; font-weight: bold; border-radius: 8px; border: 2px solid #ff9900; cursor: pointer; }
        .color-btn { width: 66%; aspect-ratio: 1/1; margin: 0 auto; border-radius: 50%; border: 2px solid #fff; cursor: pointer; font-size: 8px; color: #fff; display: flex; align-items: center; justify-content: center; }
        #user-list { position: fixed; top: 135px; right: 10px; z-index: 2000; background: rgba(0,0,0,0.8); color: #fff; padding: 8px; border-radius: 8px; width: 100px; border: 1px solid #ff9900; font-size: 10px; }
        .user-item { border-bottom: 1px solid #444; padding: 4px 0; }
        #register-object-btn { display: none; position: fixed; bottom: 80px; left: 20px; z-index: 5000; padding: 20px 25px; font-size: 20px; font-weight: bold; background: #ff9900; color: black; border-radius: 50%; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="header">
    <div style="font-weight:bold;">虎キング v3.9.6 <span style="font-size:10px; font-weight:normal;">by Popolo App.com</span></div>
</div>

<button id="register-object-btn">登録</button>
<div id="map"></div>
<div id="user-list"><div id="list-content"></div></div>

<div id="setup-overlay" style="display:none;">
    <div class="setup-box">
        <h3 style="color:#ff9900;">虎キング 設定</h3>
        <input type="text" id="setup-name" placeholder="名前" style="padding:10px; width:80%; margin-bottom:10px;">
        <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button type="button" onclick="selectStyleMode('normal')" id="style-btn-normal" class="style-btn">👤 通常</button>
            <button type="button" onclick="selectStyleMode('ship')" id="style-btn-ship" class="style-btn">🚤 フネ</button>
            <button type="button" onclick="selectStyleMode('buoy')" id="style-btn-buoy" class="style-btn">🚩 ブイ</button>
        </div>
        <div id="color-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:5px;"></div>
        <button onclick="saveProfile()" style="margin-top:15px; padding:10px 20px;">決定</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://tra-king-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myId = localStorage.getItem('tora_king_id') || "tiger_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('tora_king_id', myId);
    
    let myName = localStorage.getItem('tora_king_name');
    let myParticipantType = localStorage.getItem('tora_king_part_type') || 'normal';
    let myColor = localStorage.getItem('tora_king_color') || '#ff9900';

    const map = L.map('map').setView([26.3, 127.8], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const userMarkers = {};

    function selectStyleMode(mode) {
        myParticipantType = mode;
        ['normal','ship','buoy'].forEach(m => {
            const b = document.getElementById('style-btn-' + m);
            b.style.background = (m === mode) ? '#ff9900' : '#444';
            b.style.color = (m === mode) ? '#000' : '#fff';
        });
    }

    function saveProfile() {
        myName = document.getElementById('setup-name').value;
        localStorage.setItem('tora_king_name', myName);
        localStorage.setItem('tora_king_part_type', myParticipantType);
        localStorage.setItem('tora_king_color', myColor);
        document.getElementById('setup-overlay').style.display = 'none';
        startTracking();
    }

    // 「登録」ボタンの管理：管理者パスワードが必要と仮定
    document.getElementById('register-object-btn').style.display = 'block'; 
    document.getElementById('register-object-btn').onclick = () => {
        if(prompt("パスワード") === "1234") {
            map.once('click', e => {
                db.ref('objects/' + Date.now()).set({ lat: e.latlng.lat, lng: e.latlng.lng, type: 'buoy', color: '#ff0000' });
            });
        }
    };

    function startTracking() {
        navigator.geolocation.watchPosition(pos => {
            const userData = { lat: pos.coords.latitude, lng: pos.coords.longitude, name: myName, color: myColor, partType: myParticipantType, ts: Date.now() };
            db.ref('users/' + myId).set(userData);
        });
    }

    // ユーザー表示ループ（全員表示）
    db.ref('users').on('value', snap => {
        const users = snap.val();
        let listHtml = "";
        for (let id in users) {
            const u = users[id];
            if (!u || Date.now() - u.ts > 600000) continue;
            
            // アイコン描画
            if (!userMarkers[id]) userMarkers[id] = L.marker([u.lat, u.lng]).addTo(map);
            userMarkers[id].setLatLng([u.lat, u.lng]);
            
            listHtml += `<div class="user-item">${u.name || (u.partType === 'ship' ? '🚤フネ' : '🚩ブイ')}</div>`;
        }
        document.getElementById('list-content').innerHTML = listHtml;
    });

    // 初期化
    if (!myName) document.getElementById('setup-overlay').style.display = 'flex';
    else startTracking();
</script>
</body>
</html>
